name = "tdcc-landing"
main = "src/worker.js"
compatibility_date = "2025-07-21"

[assets]
directory = "."
binding = "ASSETS"
# The API must reach the Worker even though static files are served first.
run_worker_first = ["/api/*", "/v1/*"]

# GPU marketplace storage. Create once with
#   npx wrangler d1 create tdcc-market
# paste the printed database_id below, then apply migrations with
#   npx wrangler d1 migrations apply tdcc-market --remote
[[d1_databases]]
binding = "DB"
database_name = "tdcc-market"
database_id = "29f61381-4d0b-491e-9bcb-dedc3d012699"
migrations_dir = "migrations"

# Expires finished rentals and unanswered requests, cleans up old rows, and
# pays hosts once the dispute window has passed.
[triggers]
crons = ["*/10 * * * *"]

# Optional settings. Each feature turns on when its secret is set:
#   npx wrangler secret put RESEND_API_KEY        # email (https://resend.com)
#   npx wrangler secret put STRIPE_SECRET_KEY     # card payments + host payouts (Stripe Connect)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET #   endpoint: https://<site>/api/stripe/webhook
#   npx wrangler secret put MARKET_SIGNING_KEY    # signs tdcc access grants (npm run keygen)
#   npx wrangler secret put TURNSTILE_SECRET      # robot check on sign-up (+ TURNSTILE_SITE_KEY below)
#   npx wrangler secret put SENTRY_DSN            # error reports
# Without email, password reset says it is unavailable and email
# verification is not required. Without Stripe, host and renter settle
# payment between themselves.
[vars]
EMAIL_FROM = "TDCC Marketplace <marketplace@decentralizedcompute.company>"
SITE_URL = "https://decentralizedcompute.company"
# Comma-separated; these accounts see /admin.html once their email is confirmed.
ADMIN_EMAILS = "anil@decentralizedcompute.company"
# Marketplace fee on card payments, in basis points (1000 = 10%).
PLATFORM_FEE_BPS = "1000"
# Prepaid balance, USDC top-ups and the metered API (/v1, /chat.html).
# See docs/billing-api.md. The provider stays private, so set these in the
# dashboard (Settings > Variables and secrets) rather than here:
#   SOLANA_TREASURY    wallet address that receives USDC (plain var)
#   SOLANA_RPC_URL     secret, e.g. a Helius mainnet URL with its API key
#   UPSTREAM_BASE_URL  secret, OpenAI-compatible provider base URL
#   UPSTREAM_API_KEYS  secret, comma-separated provider keys
#   UPSTREAM_MODEL     secret, provider model served as tdcc-chat
#   UPSTREAM_PRICE_IN / UPSTREAM_PRICE_OUT  provider USD per 1M tokens
# Without the prices the API refuses requests instead of serving for free.
PRICE_MARKUP = "1.5"
SOLANA_CLUSTER = "mainnet-beta"
# Public Turnstile site key; only used when TURNSTILE_SECRET is set.
# TURNSTILE_SITE_KEY = ""
