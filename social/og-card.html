<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TDCC link preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
<style>
  /* Link preview (og:image / twitter:image), 1200x630, in the site's design.
     Render with `node social/render-og.mjs` -> assets/og-image-v2.jpg.
     X and others crop to roughly the centre, so keep text away from the edges. */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #06122a;
    background: #f4ecdc url("../assets/hero-landscape.webp") center 62% / cover no-repeat; }
  .wrap { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
  .wrap::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(244,236,220,.55) 0%, rgba(244,236,220,.15) 55%, rgba(244,236,220,0) 100%); }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 30px; letter-spacing: -.02em; }
  .brand svg { width: 54px; height: 36px; }
  h1 { margin: 46px 0 0; max-width: 820px; font-family: "Source Serif 4", Georgia, serif; font-weight: 700; font-size: 74px; line-height: 1.03; letter-spacing: -.02em; color: #0e2e47; }
  .sub { margin-top: 22px; max-width: 760px; font-size: 26px; line-height: 1.4; color: #2b3d52; }
  .row { margin-top: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 999px; background: rgba(255,255,255,.85);
    border: 1px solid rgba(255,255,255,.95); box-shadow: 0 8px 24px -12px rgba(6,18,42,.3); font-size: 20px; font-weight: 600; }
  .pill i { width: 10px; height: 10px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 4px rgba(22,163,74,.18); }
  .pill.dark { background: #06122a; border-color: #06122a; color: #fff; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 120 80">
      <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 70 H111 A15 15 0 0 0 95 47 A33 33 0 0 0 29 47 A17 17 0 0 0 9 70 Z" />
        <g stroke-width="1.5" opacity=".85">
          <path d="M62 14 V70" />
          <path d="M62 14 C49 22 46 46 48 70" /><path d="M62 14 C75 22 78 46 76 70" />
          <path d="M62 14 C40 20 33 44 35 70" /><path d="M62 14 C84 20 91 44 89 70" />
          <path d="M38 26 Q62 31 86 26" /><path d="M31 39 Q62 45 93 39" /><path d="M29 54 Q62 60 95 54" />
        </g>
      </g>
      <g fill="currentColor">
        <rect x="59.5" y="26.5" width="5" height="5" /><rect x="45" y="39" width="5" height="5" /><rect x="74" y="39" width="5" height="5" />
        <rect x="59.5" y="42" width="5" height="5" /><rect x="33" y="52" width="4.5" height="4.5" /><rect x="86.5" y="52" width="4.5" height="4.5" />
        <rect x="59.5" y="57" width="5" height="5" /><rect x="47" y="27" width="4" height="4" /><rect x="73" y="27" width="4" height="4" />
      </g>
    </symbol>
  </svg>
  <div class="wrap">
    <div class="brand"><svg aria-hidden="true"><use href="#mark" /></svg>tdcc</div>
    <h1>Every GPU on Earth, working as one.</h1>
    <p class="sub">Uncensored AI chat, a pay-per-token API and a GPU marketplace on one network.</p>
    <div class="row">
      <span class="pill"><i></i>Free chat, no login</span>
      <span class="pill">GPU marketplace</span>
      <span class="pill dark">decentralizedcompute.company</span>
    </div>
  </div>
</body>
</html>
