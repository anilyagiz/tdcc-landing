<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0b09" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Confirm | The Decentralized Compute Company</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/site.css" />
  <style>
    .c-wrap { min-height: calc(100vh - 220px); display: grid; place-items: center; padding-top: 56px; padding-bottom: 56px; }
    .c-box { width: 100%; max-width: 460px; display: grid; gap: 16px; padding: 32px; border: 1px solid var(--line); background: var(--panel); }
    .c-box h1 { font-family: var(--serif); font-size: 34px; line-height: 1.1; }
    .c-box p { color: var(--body); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 120 80">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 70 H111 A15 15 0 0 0 95 47 A33 33 0 0 0 29 47 A17 17 0 0 0 9 70 Z" />
        <g stroke-width="1.4" opacity=".85"><path d="M62 14 V70" /><path d="M62 14 C49 22 46 46 48 70" /><path d="M62 14 C75 22 78 46 76 70" /><path d="M62 14 C40 20 33 44 35 70" /><path d="M62 14 C84 20 91 44 89 70" /><path d="M38 26 Q62 31 86 26" /><path d="M31 39 Q62 45 93 39" /><path d="M29 54 Q62 60 95 54" /></g>
      </g>
      <g fill="currentColor"><rect x="59.5" y="26.5" width="5" height="5" /><rect x="45" y="39" width="5" height="5" /><rect x="74" y="39" width="5" height="5" /><rect x="59.5" y="42" width="5" height="5" /><rect x="33" y="52" width="4.5" height="4.5" /><rect x="86.5" y="52" width="4.5" height="4.5" /><rect x="59.5" y="57" width="5" height="5" /></g>
    </symbol>
  </svg>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/" aria-label="The Decentralized Compute Company home"><svg aria-hidden="true"><use href="#mark" /></svg><span class="brand-name">tdcc</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Primary navigation"><a href="/marketplace.html">Marketplace</a><a class="btn solid sm" href="/marketplace.html#hosts">List your GPU</a></nav>
    </div>
  </header>
  <main id="content" class="wrap c-wrap">
    <div class="c-box" id="box"><p class="mono">Checking your link…</p></div>
  </main>
  <script src="/js/market.js"></script>
  <script>
    (() => {
      const { api, esc, setUser, toast } = window.TDCC;
      const box = document.getElementById('box');
      const params = new URLSearchParams(location.hash.slice(1));
      // Drop the token from the address bar and history right away.
      history.replaceState(null, '', location.pathname);
      const verify = params.get('verify'), reset = params.get('reset');

      if (verify) {
        api('POST', '/api/auth/verify', { token: verify })
          .then(() => { box.innerHTML = '<h1>Email confirmed.</h1><p>You can now list GPUs and send rental requests.</p><div class="actions"><a class="btn solid" href="/account.html">Go to my account →</a><a class="btn" href="/marketplace.html">Browse GPUs</a></div>'; })
          .catch((err) => { box.innerHTML = `<h1>That link did not work.</h1><p>${esc(err.message)}</p><div class="actions"><a class="btn solid" href="/account.html">Go to my account →</a></div>`; });
      } else if (reset) {
        box.innerHTML = `<form id="f" novalidate style="display:grid;gap:16px">
          <h1>Choose a new password.</h1>
          <div class="form-err" id="err" role="alert"></div>
          <label class="fl">New password<input class="inp" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="200" required autofocus /><small>At least 10 characters. You will be signed out everywhere else.</small></label>
          <label class="fl">Repeat it<input class="inp" name="again" type="password" autocomplete="new-password" maxlength="200" required /></label>
          <button class="btn solid" type="submit">Save and sign in →</button></form>`;
        const f = document.getElementById('f'), err = document.getElementById('err');
        const fail = (m) => { err.textContent = m; err.classList.add('show'); };
        f.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (f.password.value.length < 10) return fail('Use at least 10 characters.');
          if (f.password.value !== f.again.value) return fail('The two passwords are different.');
          const btn = f.querySelector('button'); btn.disabled = true;
          try {
            const d = await api('POST', '/api/auth/reset', { token: reset, password: f.password.value });
            setUser(d.user);
            toast('Password changed');
            location.href = '/account.html';
          } catch (ex) { fail(ex.message); btn.disabled = false; }
        });
      } else {
        box.innerHTML = '<h1>Nothing to confirm.</h1><p>Open the link from your email again, or start from your account page.</p><div class="actions"><a class="btn solid" href="/account.html">Go to my account →</a></div>';
      }
    })();
  </script>
</body>
</html>
